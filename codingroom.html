<h2>Coding Room</h2>
<button onclick="toggleTheme()">🌙</button>
</nav>

<section class="room">
<p id="welcomeMsg"></p>
<h1>Code & Focus</h1>

<div id="timer">00:00:00</div>
<div class="buttons">
<button onclick="startTimer()">Start</button>
<button onclick="pauseTimer()">Pause</button>
<button onclick="resetTimer()">Reset</button>
</div>

<!-- coding area -->
<textarea placeholder="Write your coding notes..."></textarea>

<!-- ✅ Notes Section -->
<div class="notes-section">
    <h3>📝 Notes</h3>
    <textarea id="notesArea" placeholder="Write your study notes here..."></textarea>

    <div class="notes-buttons">
        <button onclick="saveNotes()">💾 Save</button>
        <button onclick="clearNotes()">🗑 Clear</button>
    </div>
</div>

<!-- Code Tips -->
<div class="code-tips">
<h3>⚡ Coding Tips</h3>
<p id="tip">Click below to get a tip!</p>
<button onclick="newTip()">New Tip</button>
</div>

</section>

<script src="timer.js"></script>

<!-- ✅ Notes Script -->
<script>
window.onload = function () {
    const savedNotes = localStorage.getItem("studyNotes");
    if (savedNotes) {
        document.getElementById("notesArea").value = savedNotes;
    }
};

function saveNotes() {
    const notes = document.getElementById("notesArea").value;
    localStorage.setItem("studyNotes", notes);
    alert("Notes saved!");
}

function clearNotes() {
    document.getElementById("notesArea").value = "";
    localStorage.removeItem("studyNotes");
}
</script>

</body>
</html>
