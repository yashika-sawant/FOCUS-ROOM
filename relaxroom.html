<h2>Coding Room</h2>
<button onclick="toggleTheme()">🌙</button>
</nav>

<section class="room">

</div>
    <p id="welcomeMsg"></p>
    <div class="relax-box">
    <h2>🌿 Calm Zone</h2>
    <p>Close your eyes, breathe slowly, and let the stress fade away...</p>

    <!-- Breathing Guide -->
    <p id="breathText">Breathe In...</p>
</div>
<div class="quote-box">
    <p id="quoteText">"Relax. Refresh. Restart."</p>
    <button onclick="newQuote()">✨ New Quote</button>
</div>

<h1>Relax & Breathe</h1>

<div id="timer">00:00:00</div>

<div class="buttons">
<button onclick="startTimer()">Start</button>
<button onclick="pauseTimer()">Pause</button>
<button onclick="resetTimer()">Reset</button>
</div>

<p>Take deep breaths and relax.</p>

<!-- SOUND CONTROLS -->
<div class="sound-controls">
    <button onclick="playSound()">▶ Play Relax Sound</button>
    <button onclick="stopSound()">⏸ Stop</button>
</div>

<!-- AUDIO FILE -->
<audio id="relaxSound">
    <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg">
</audio>


</section>
