<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<title>MoodMe Rooms</title>

<link rel="stylesheet" href="style.css">

<style>
/* 🐾 Pet Animation */
.pet-container {
    text-align: center;
    margin-top: 20px;
}

.pet {
    font-size: 60px;
    cursor: pointer;
    animation: floatPet 2s ease-in-out infinite;
}

@keyframes floatPet {
    0% { transform: translateY(0px); }
    50% { transform: translateY(-15px); }
    100% { transform: translateY(0px); }
}

#petMsg {
    color: gray;
}

/* ✨ Quote Box */
.quote-box {
    text-align: center;
    margin: 20px 0;
}

.quote-box p {
    font-style: italic;
    margin: 10px 0;
}
</style>

</head>

<body>

<nav>
<h2>MoodMe</h2>
<button onclick="toggleTheme()">🌙</button>
</nav>

<div class="particles">
<span></span>
<span></span>
<span></span>
<span></span>
<span></span>
<span></span>
<span></span>
</div>

<!-- 🐱 Pet BEFORE streak -->
<div class="pet-container">
    <div class="pet" onclick="petReaction()">🐱</div>
    <p id="petMsg">Tap me 🐾</p>
</div>

<!-- 🔥 Streak Dashboard -->
<div class="streak">
<h2>🔥 Daily Streak</h2>
<p id="streakCount">0 days</p>
<button onclick="increaseStreak()">Mark Today Done</button>
</div>

<!-- ✨ Quote AFTER streak -->
<div class="quote-box">
    <h3>✨ Daily Positive Quote</h3>
    <p id="quote">Click below for a boost 🌸</p>
    <button onclick="newQuote()">New Quote</button>
</div>

<!-- main container -->
<section class="rooms">

<h1>Select Your Room</h1>

<div class="room-container">

<a href="studyroom.html" class="room-card">
<h2>Study Room</h2>
<p>Focus quietly with timer</p>
</a>

<a href="codingroom.html" class="room-card">
<h2>Coding Room</h2>
<p>Code with focus timer</p>
</a>

<a href="relaxroom.html" class="room-card">
<h2>Relax Room</h2>
<p>Take a calm break</p>
</a>

</div>

</section>

<script src="timer.js"></script>

<script>
/* 🐱 Pet Interaction */
function petReaction() {
    const messages = [
        "Meowww 😸",
        "You're doing great 💛",
        "Take a deep breath 🌿",
        "Proud of you 🐾",
        "Relax, you got this ✨"
    ];

    const randomMsg = messages[Math.floor(Math.random() * messages.length)];
    document.getElementById("petMsg").innerText = randomMsg;
}

/* ✨ Quotes */
function newQuote() {
    const quotes = [
        "You are stronger than you think 💪",
        "Small steps still move you forward 🌱",
        "Rest is productive too 🌿",
        "You’ve survived 100% of your bad days ✨",
        "Progress > perfection 💛"
    ];

    const randomQuote = quotes[Math.floor(Math.random() * quotes.length)];
    document.getElementById("quote").innerText = randomQuote;
}
</script>

</body>
</html>
