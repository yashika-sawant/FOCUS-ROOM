<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<title>Relax Room</title>
<link rel="stylesheet" href="style.css">

<style>
/* 🐱 Pet */
.pet-container {
    text-align: center;
    margin: 20px 0;
}

.pet {
    font-size: 60px;
    cursor: pointer;
    animation: floatPet 2s ease-in-out infinite;
}

@keyframes floatPet {
    0% { transform: translateY(0px); }
    50% { transform: translateY(-12px); }
    100% { transform: translateY(0px); }
}

#petMsg {
    color: gray;
    margin-top: 5px;
}

/* ✨ Quotes */
.quote-box {
    text-align: center;
    margin: 20px 0;
}

.quote-box p {
    font-style: italic;
}
</style>

</head>

<body>
<div class="particles">
<span></span>
<span></span>
<span></span>
<span></span>
<span></span>
<span></span>
<span></span>
</div>

<nav>
<a href="index.html">⬅ Back</a>
<h2>Coding Room</h2>
<button onclick="toggleTheme()">🌙</button>
</nav>

<section class="room">
    <p id="welcomeMsg"></p>

    <div class="relax-box">
    <h2>🌿 Calm Zone</h2>
    <p>Close your eyes, breathe slowly, and let the stress fade away...</p>

    <!-- Breathing Guide -->
    <p id="breathText">Breathe In...</p>
</div>

<!-- 🐱 PET ADDED HERE -->
<div class="pet-container">
    <div class="pet" onclick="petReaction()">🐱</div>
    <p id="petMsg">Tap me 🐾</p>
</div>

<!-- ✨ QUOTE ADDED HERE -->
<div class="quote-box">
    <h3>✨ Positive Boost</h3>
    <p id="quote">Click below 🌸</p>
    <button onclick="newQuote()">New Quote</button>
</div>

<h1>Relax & Breathe</h1>

<div id="timer">00:00:00</div>

<div class="buttons">
<button onclick="startTimer()">Start</button>
<button onclick="pauseTimer()">Pause</button>
<button onclick="resetTimer()">Reset</button>
</div>

<p>Take deep breaths and relax.</p>

<!-- SOUND CONTROLS -->
<div class="sound-controls">
    <button onclick="playSound()">▶ Play Relax Sound</button>
    <button onclick="stopSound()">⏸ Stop</button>
</div>

<!-- AUDIO FILE -->
<audio id="relaxSound">
    <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg">
</audio>

</section>

<script src="timer.js"></script>

<script>
/* 🐱 Pet Reaction */
function petReaction() {
    const messages = [
        "Meow 😸",
        "You're doing great 💛",
        "Relax a bit 🌿",
        "Proud of you 🐾",
        "Take it easy ✨"
    ];

    document.getElementById("petMsg").innerText =
        messages[Math.floor(Math.random() * messages.length)];
}

/* ✨ Quotes */
function newQuote() {
    const quotes = [
        "You deserve this break 🌸",
        "Calm mind = better focus 🌿",
        "Rest is not wasting time 💛",
        "Breathe. Reset. Go again ✨",
        "You’re doing enough 💫"
    ];

    document.getElementById("quote").innerText =
        quotes[Math.floor(Math.random() * quotes.length)];
}
</script>

</body>
</html>
