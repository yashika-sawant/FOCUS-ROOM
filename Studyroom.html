<h2>Coding Room</h2>
<button onclick="toggleTheme()">🌙</button>
</nav>

<section class="room">
    <p id="welcomeMsg"></p>
    <div class="study-features">

    <!-- Spotify Login -->
    <div class="feature-box">
        <h3>🎵 Play Music</h3>
        <button onclick="loginSpotify()">Login to Spotify</button>
    </div>

    <!-- Create Room -->
    <div class="feature-box">
        <h3>👥 Create Study Room</h3>
        <button onclick="createRoom()">Create Room Link</button>
        <p id="roomLink"></p>
    </div>

    <!-- AI Doubt Solver -->
 <div class="feature-box ai-box">
    <h3>🤖 Ask Doubt</h3>

    <div class="ai-chat">
        <p id="aiResponse">Ask me anything 👇</p>
    </div>

    <div class="ai-input">
        <input type="text" id="doubtInput" placeholder="Type your doubt...">
        <button onclick="solveDoubt()">➤</button>
    </div>
</div>

</div>

<h1>Focus Mode</h1>

<!-- timer display -->
<div id="timer">00:00:00</div>

<!-- timer buttons -->
<div class="buttons">
<button onclick="startTimer()">Start</button>
<button onclick="pauseTimer()">Pause</button>
<button onclick="resetTimer()">Reset</button>
</div>

</section>

<script src="timer.js"></script>

</body>
</html>
